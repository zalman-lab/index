<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peserta — PKS Skills</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="js/pks-shared.js"></script>
</head>
<body>
  <div class="app-wrapper" id="app"></div>
  <div id="loading-spinner"><div class="spinner"></div></div>

  <!-- Modal Tambah/Edit Peserta -->
  <div class="modal-overlay" id="modal-peserta">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-tajuk">Tambah Peserta Baru</h3>
        <button class="modal-close" id="modal-tutup">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="peserta-id" />
        <div class="form-grid-2">
          <div class="form-group"><label>Nama Penuh *</label><input type="text" id="p-nama" class="form-control" placeholder="Nama penuh peserta" /></div>
          <div class="form-group"><label>No. Matrik *</label><input type="text" id="p-matrik" class="form-control" placeholder="cth: PKS2301234" /></div>
          <div class="form-group"><label>Program / Kursus *</label><input type="text" id="p-program" class="form-control" placeholder="cth: Diploma Kejuruteraan Mekanikal" /></div>
          <div class="form-group"><label>Jabatan *</label><input type="text" id="p-jabatan" class="form-control" placeholder="cth: Jabatan Kejuruteraan Mekanikal" /></div>
          <div class="form-group">
            <label>Tahun Pengajian</label>
            <select id="p-tahun" class="form-control">
              <option value="">-- Pilih --</option>
              <option value="1">Tahun 1</option>
              <option value="2">Tahun 2</option>
              <option value="3">Tahun 3</option>
            </select>
          </div>
          <div class="form-group"><label>No. Telefon</label><input type="tel" id="p-tel" class="form-control" placeholder="cth: 011-12345678" /></div>
          <div class="form-group"><label>Bidang Kemahiran *</label><input type="text" id="p-bidang" class="form-control" placeholder="cth: CNC Turning" /></div>
          <div class="form-group">
            <label>Jurulatih Ditugaskan</label>
            <select id="p-jurulatih" class="form-control"><option value="">-- Tiada / Pilih Jurulatih --</option></select>
          </div>
          <div class="form-group">
            <label>Status</label>
            <select id="p-status" class="form-control">
              <option value="Aktif">Aktif</option>
              <option value="Alumni">Alumni</option>
              <option value="Tidak Aktif">Tidak Aktif</option>
            </select>
          </div>
          <div class="form-group"><label>No. IC</label><input type="text" id="p-ic" class="form-control" placeholder="cth: 050101-13-1234" /></div>
        </div>
        <div class="form-group"><label>Catatan Khusus</label><textarea id="p-catatan" class="form-control" rows="2" placeholder="Catatan tambahan..."></textarea></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="modal-batal">Batal</button>
        <button class="btn btn-primary" id="btn-simpan-peserta"><i class="fa-solid fa-floppy-disk"></i> Simpan</button>
      </div>
    </div>
  </div>

  <!-- Modal Padam -->
  <div class="modal-overlay" id="modal-padam">
    <div class="modal" style="max-width:420px;">
      <div class="modal-header">
        <h3><i class="fa-solid fa-triangle-exclamation" style="color:var(--pks-danger);margin-right:8px;"></i>Sahkan Padam</h3>
        <button class="modal-close" id="padam-tutup">&times;</button>
      </div>
      <div class="modal-body">
        <p>Adakah anda pasti ingin memadam rekod peserta <strong id="padam-nama"></strong>?</p>
        <p style="color:var(--pks-teks-muted);font-size:12px;margin-top:8px;">Tindakan ini tidak boleh dibatalkan.</p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="padam-batal">Batal</button>
        <button class="btn btn-danger" id="btn-sahkan-padam"><i class="fa-solid fa-trash"></i> Ya, Padam</button>
      </div>
    </div>
  </div>

  <script>
    document.getElementById("app").innerHTML =
      pksLayout("Pengurusan Peserta", "peserta") +
      '<div class="page-content">' +
        '<div class="page-header">' +
          '<div><h1><i class="fa-solid fa-users" style="color:var(--pks-biru);margin-right:8px;"></i>Senarai Peserta</h1>' +
          '<p>Urus rekod peserta pertandingan kemahiran PKS</p></div>' +
          '<button class="btn btn-primary" id="btn-tambah"><i class="fa-solid fa-plus"></i> Tambah Peserta</button>' +
        '</div>' +
        '<div class="card"><div class="card-body">' +
          '<div class="toolbar">' +
            '<div class="search-box"><i class="fa-solid fa-search"></i><input type="text" id="carian" class="form-control" placeholder="Cari nama atau no. matrik..." /></div>' +
            '<select id="tapis-status" class="form-control" style="width:160px;"><option value="">Semua Status</option><option value="Aktif">Aktif</option><option value="Alumni">Alumni</option><option value="Tidak Aktif">Tidak Aktif</option></select>' +
            '<select id="tapis-bidang" class="form-control" style="width:200px;"><option value="">Semua Bidang</option></select>' +
          '</div>' +
          '<div class="table-wrapper"><table>' +
            '<thead><tr><th>#</th><th>Nama Peserta</th><th>No. Matrik</th><th>Program</th><th>Bidang Kemahiran</th><th>Jurulatih</th><th>Status</th><th>Tindakan</th></tr></thead>' +
            '<tbody id="tbody-peserta"></tbody>' +
          '</table></div>' +
          '<div class="pagination"><span id="info-pagination">-</span><div class="pagination-btns" id="pagination-btns"></div></div>' +
        '</div></div>' +
      '</div></div>';

    pksInitLayout();

    var REKOD = 10, halaman = 1, padamId = null;

    function muatDropdown() {
      var j = pksGet("jurulatih");
      var sel = document.getElementById("p-jurulatih");
      sel.innerHTML = '<option value="">-- Tiada / Pilih Jurulatih --</option>';
      j.forEach(function(x){ sel.innerHTML += '<option value="' + x.id + '">' + x.nama + (x.jabatan?" ("+x.jabatan+")":"") + '</option>'; });
    }

    function populateBidang() {
      var p = pksGet("peserta");
      var bidang = {};
      p.forEach(function(x){ if(x.bidangKemahiran) bidang[x.bidangKemahiran]=1; });
      var sel = document.getElementById("tapis-bidang");
      sel.innerHTML = '<option value="">Semua Bidang</option>';
      Object.keys(bidang).forEach(function(b){ sel.innerHTML += '<option value="'+b+'">'+b+'</option>'; });
    }

    function renderJadual() {
      var peserta = pksGet("peserta");
      var jurulatih = pksGet("jurulatih");
      var teks = document.getElementById("carian").value.toLowerCase();
      var status = document.getElementById("tapis-status").value;
      var bidang = document.getElementById("tapis-bidang").value;
      var data = peserta.filter(function(p){
        return (p.nama&&p.nama.toLowerCase().indexOf(teks)!==-1 || p.noMatrik&&p.noMatrik.toLowerCase().indexOf(teks)!==-1) &&
               (!status||p.status===status) && (!bidang||p.bidangKemahiran===bidang);
      });
      var jumlah = data.length, total = Math.max(1,Math.ceil(jumlah/REKOD));
      if(halaman>total) halaman=1;
      var mula = (halaman-1)*REKOD, baris = data.slice(mula,mula+REKOD);
      var tbody = document.getElementById("tbody-peserta");
      if(baris.length===0){
        tbody.innerHTML='<tr><td colspan="8"><div class="empty-state"><i class="fa-solid fa-users-slash"></i><p>Tiada rekod peserta.</p></div></td></tr>';
      } else {
        tbody.innerHTML = baris.map(function(p,i){
          var j = jurulatih.find(function(x){return x.id===p.jurulatihId;});
          var bs = p.status==="Aktif"?"badge-aktif":"badge-alumni";
          return '<tr><td>'+(mula+i+1)+'</td><td><strong>'+(p.nama||"-")+'</strong></td>' +
            '<td><code style="font-size:11px;background:#f0f4fa;padding:2px 6px;border-radius:4px;">'+(p.noMatrik||"-")+'</code></td>' +
            '<td>'+(p.program||"-")+'</td><td>'+(p.bidangKemahiran||"-")+'</td>' +
            '<td>'+(j?j.nama:"-")+'</td>' +
            '<td><span class="badge '+bs+'">'+(p.status||"-")+'</span></td>' +
            '<td><button class="btn btn-secondary btn-sm btn-icon" onclick="bukaBosang(\''+p.id+'\')"><i class="fa-solid fa-pen"></i></button> ' +
            '<button class="btn btn-danger btn-sm btn-icon" onclick="tunjukPadam(\''+p.id+'\',\''+p.nama.replace(/'/g,"\\'")+'\')"><i class="fa-solid fa-trash"></i></button></td>' +
            '</tr>';
        }).join("");
      }
      document.getElementById("info-pagination").textContent = "Menunjukkan "+(baris.length>0?mula+1:0)+"–"+(mula+baris.length)+" daripada "+jumlah+" rekod";
      var pb = document.getElementById("pagination-btns"); pb.innerHTML="";
      var prev=document.createElement("button"); prev.innerHTML='<i class="fa-solid fa-chevron-left"></i>'; prev.disabled=halaman<=1; prev.onclick=function(){halaman--;renderJadual();}; pb.appendChild(prev);
      for(var h=1;h<=Math.min(total,7);h++){var b=document.createElement("button");b.textContent=h;if(h===halaman)b.classList.add("active");(function(hh){b.onclick=function(){halaman=hh;renderJadual();};})(h);pb.appendChild(b);}
      var next=document.createElement("button"); next.innerHTML='<i class="fa-solid fa-chevron-right"></i>'; next.disabled=halaman>=total; next.onclick=function(){halaman++;renderJadual();}; pb.appendChild(next);
    }

    function bukaBosang(id) {
      muatDropdown();
      if(id){
        var p = pksGet("peserta").find(function(x){return x.id===id;});
        document.getElementById("modal-tajuk").textContent="Kemaskini Rekod Peserta";
        document.getElementById("peserta-id").value=id;
        document.getElementById("p-nama").value=p.nama||"";
        document.getElementById("p-matrik").value=p.noMatrik||"";
        document.getElementById("p-program").value=p.program||"";
        document.getElementById("p-jabatan").value=p.jabatan||"";
        document.getElementById("p-tahun").value=p.tahunPengajian||"";
        document.getElementById("p-tel").value=p.noTel||"";
        document.getElementById("p-bidang").value=p.bidangKemahiran||"";
        document.getElementById("p-jurulatih").value=p.jurulatihId||"";
        document.getElementById("p-status").value=p.status||"Aktif";
        document.getElementById("p-ic").value=p.noIc||"";
        document.getElementById("p-catatan").value=p.catatan||"";
      } else {
        document.getElementById("modal-tajuk").textContent="Tambah Peserta Baru";
        document.getElementById("peserta-id").value="";
        ["p-nama","p-matrik","p-program","p-jabatan","p-tel","p-bidang","p-ic","p-catatan"].forEach(function(id){document.getElementById(id).value="";});
        document.getElementById("p-tahun").value=""; document.getElementById("p-status").value="Aktif"; document.getElementById("p-jurulatih").value="";
      }
      document.getElementById("modal-peserta").classList.add("active");
    }

    function tunjukPadam(id,nama){
      padamId=id; document.getElementById("padam-nama").textContent=nama;
      document.getElementById("modal-padam").classList.add("active");
    }

    document.getElementById("btn-tambah").addEventListener("click",function(){bukaBosang(null);});
    document.getElementById("btn-simpan-peserta").addEventListener("click",function(){
      var nama=document.getElementById("p-nama").value.trim();
      var noMatrik=document.getElementById("p-matrik").value.trim();
      var program=document.getElementById("p-program").value.trim();
      var jabatan=document.getElementById("p-jabatan").value.trim();
      var bidangKemahiran=document.getElementById("p-bidang").value.trim();
      if(!nama||!noMatrik||!program||!jabatan||!bidangKemahiran){pksToast("Sila lengkapkan semua medan bertanda *.","error");return;}
      var senarai=pksGet("peserta"), idSedia=document.getElementById("peserta-id").value;
      var data={id:idSedia||pksId(),nama,noMatrik,program,jabatan,
        tahunPengajian:document.getElementById("p-tahun").value,
        noTel:document.getElementById("p-tel").value.trim(),
        bidangKemahiran,jurulatihId:document.getElementById("p-jurulatih").value||null,
        status:document.getElementById("p-status").value,
        noIc:document.getElementById("p-ic").value.trim(),
        catatan:document.getElementById("p-catatan").value.trim(),
        tarikhDaftar:idSedia?(senarai.find(function(x){return x.id===idSedia;})||{}).tarikhDaftar||new Date().toISOString():new Date().toISOString()
      };
      if(idSedia){pksSave("peserta",senarai.map(function(x){return x.id===idSedia?data:x;}));pksToast("Rekod peserta berjaya dikemaskini.");}
      else{pksSave("peserta",[...senarai,data]);pksToast("Peserta baru berjaya didaftarkan.");}
      document.getElementById("modal-peserta").classList.remove("active");
      populateBidang(); renderJadual();
    });
    document.getElementById("btn-sahkan-padam").addEventListener("click",function(){
      if(!padamId)return;
      pksSave("peserta",pksGet("peserta").filter(function(x){return x.id!==padamId;}));
      document.getElementById("modal-padam").classList.remove("active");
      pksToast("Rekod peserta berjaya dipadam."); padamId=null;
      populateBidang(); renderJadual();
    });
    ["modal-tutup","modal-batal"].forEach(function(id){document.getElementById(id).addEventListener("click",function(){document.getElementById("modal-peserta").classList.remove("active");});});
    ["padam-tutup","padam-batal"].forEach(function(id){document.getElementById(id).addEventListener("click",function(){document.getElementById("modal-padam").classList.remove("active");padamId=null;});});
    ["carian","tapis-status","tapis-bidang"].forEach(function(id){document.getElementById(id).addEventListener("input",function(){halaman=1;renderJadual();});});

    populateBidang(); renderJadual();
  </script>
</body>
</html>
